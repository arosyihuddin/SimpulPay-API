<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRIS Kedaluwarsa</title>
  <script>try{var t=localStorage.getItem('gopay_theme');if(t==='dark'||(t===null&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #e6ebf2;
      --text-main: #4a5568;
      --text-muted: #94a3b8;
      --shadow-light: #ffffff;
      --shadow-dark: #cbd5e1;
      --inset-light: #ffffff;
      --inset-dark: #cbd5e1;
      --border-subtle: rgba(203, 213, 225, 0.6);
      --accent: #4f46e5;
    }
    .dark {
      --bg-base: #181c24;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --shadow-light: #222732;
      --shadow-dark: #0e1116;
      --inset-light: #222732;
      --inset-dark: #0e1116;
      --border-subtle: rgba(34, 39, 50, 0.8);
      --accent: #818cf8;
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
    body{background:var(--bg-base);color:var(--text-main);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;transition:background .3s,color .3s}
    .tactile-box{background:var(--bg-base);box-shadow:9px 9px 16px var(--shadow-dark),-9px -9px 16px var(--shadow-light);border-radius:1.5rem;transition:all .2s}
    .card{width:100%;max-width:420px;padding:40px 24px;text-align:center}
    .icon{width:72px;height:72px;margin:0 auto 20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;color:#f87171;background:var(--bg-base);box-shadow:inset 4px 4px 8px var(--inset-dark),inset -4px -4px 8px var(--inset-light)}
    h1{font-size:20px;font-weight:800;margin-bottom:8px}
    p{font-size:13px;color:var(--text-muted);margin-bottom:24px}
    .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);text-decoration:none;font-weight:600}
    .back-link:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="card tactile-box">
    <div class="icon"><i class="fa-solid fa-circle-xmark"></i></div>
    <h1>QRIS Kedaluwarsa</h1>
    <p>Kode QR ini sudah melewati batas waktu pembayaran dan tidak dapat digunakan lagi.</p>
    <a class="back-link" href="/"><i class="fa-solid fa-arrow-left"></i> Kembali ke dashboard</a>
  </div>
</body>
</html>
