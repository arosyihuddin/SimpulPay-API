<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran QRIS - {{AMOUNT}}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2310b981'/%3E%3Crect x='7' y='7' width='18' height='18' rx='3' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='10' cy='10' r='1.8' fill='white'/%3E%3Ccircle cx='17' cy='10' r='1.8' fill='white'/%3E%3Ccircle cx='24' cy='10' r='1.8' fill='white'/%3E%3Ccircle cx='13' cy='17' r='1.8' fill='white'/%3E%3Ccircle cx='20' cy='17' r='1.8' fill='white'/%3E%3Ccircle cx='10' cy='24' r='1.8' fill='white'/%3E%3Ccircle cx='17' cy='24' r='1.8' fill='white'/%3E%3Ccircle cx='24' cy='24' r='1.8' fill='white'/%3E%3C/svg%3E" />
  <script>try{var t=localStorage.getItem('gopay_theme');if(t==='dark'||(t===null&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #e6ebf2;
      --text-main: #4a5568;
      --text-muted: #94a3b8;
      --shadow-light: #ffffff;
      --shadow-dark: #cbd5e1;
      --inset-light: #ffffff;
      --inset-dark: #cbd5e1;
      --border-subtle: rgba(203, 213, 225, 0.6);
      --accent: #4f46e5;
    }
    .dark {
      --bg-base: #181c24;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --shadow-light: #222732;
      --shadow-dark: #0e1116;
      --inset-light: #222732;
      --inset-dark: #0e1116;
      --border-subtle: rgba(34, 39, 50, 0.8);
      --accent: #818cf8;
    }
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
    body{background:var(--bg-base);color:var(--text-main);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;transition:background .3s,color .3s}
    .tactile-box{background:var(--bg-base);box-shadow:9px 9px 16px var(--shadow-dark),-9px -9px 16px var(--shadow-light);border-radius:1.5rem;transition:all .2s}
    .tactile-inset{background:var(--bg-base);box-shadow:inset 5px 5px 10px var(--inset-dark),inset -5px -5px 10px var(--inset-light);border-radius:1rem;transition:background .3s,box-shadow .3s}
    .tactile-btn{background:var(--bg-base);box-shadow:6px 6px 12px var(--shadow-dark),-6px -6px 12px var(--shadow-light);border-radius:1rem;transition:all .15s}
    .tactile-btn:hover{box-shadow:8px 8px 16px var(--shadow-dark),-8px -8px 16px var(--shadow-light);transform:translateY(-1px)}
    .tactile-btn:active,.tactile-btn.active{box-shadow:inset 4px 4px 8px var(--inset-dark),inset -4px -4px 8px var(--inset-light);transform:translateY(1px)}
    .card{width:100%;max-width:420px;padding:28px 24px;text-align:center}
    .badge-qris{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:13px;padding:8px 16px;border-radius:9999px;background:var(--bg-base);box-shadow:4px 4px 8px var(--shadow-dark),-4px -4px 8px var(--shadow-light);margin-bottom:16px}
    .amount-title{font-size:13px;color:var(--text-muted);margin-bottom:4px;font-weight:500}
    .amount-value{font-size:28px;font-weight:800;color:var(--accent);letter-spacing:-.5px;margin-bottom:20px}
    .qr-wrapper{padding:16px;display:inline-block;margin-bottom:20px}
    .qr-wrapper img{display:block;width:240px;height:240px;border-radius:8px}
    .timer-box{padding:12px 16px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--text-main)}
    .timer-val{font-weight:700;color:#fbbf24;font-family:monospace;font-size:16px}
    .status-badge{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;padding:12px;border-radius:12px;margin-bottom:20px;transition:all .3s}
    .status-pending{color:#fbbf24;background:rgba(251,191,36,.1);box-shadow:inset 4px 4px 8px var(--inset-dark),inset -4px -4px 8px var(--inset-light)}
    .status-paid{color:#34d399;background:rgba(52,211,153,.1);box-shadow:inset 4px 4px 8px var(--inset-dark),inset -4px -4px 8px var(--inset-light)}
    .status-expired{color:#f87171;background:rgba(248,113,113,.1);box-shadow:inset 4px 4px 8px var(--inset-dark),inset -4px -4px 8px var(--inset-light)}
    .btn-check{width:100%;color:var(--accent);font-weight:700;font-size:15px;padding:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border:none}
    .btn-check:disabled{cursor:not-allowed;opacity:.6;transform:none}
    .toggle-box{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:var(--text-muted);margin-top:16px}
    .back-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);text-decoration:none;margin-top:20px}
    .back-link:hover{color:var(--accent)}
    .toggle-box input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
    .spinner{width:18px;height:18px;border:2px solid rgba(129,140,248,.3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    .success-box{display:none;border-radius:12px;padding:16px;text-align:left;font-size:13px;color:var(--text-main);margin-top:16px;background:var(--bg-base);box-shadow:inset 5px 5px 10px var(--inset-dark),inset -5px -5px 10px var(--inset-light)}
    .success-box strong{color:#34d399;display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:6px}
    .success-box p{margin-bottom:4px;color:var(--text-muted)}
    .success-box span{color:var(--text-main);font-weight:600}
  </style>
</head>
<body>
  <div class="card tactile-box">
    <div class="badge-qris">
      <i class="fa-solid fa-qrcode"></i> Scan QRIS untuk bayar
    </div>
    <div class="amount-title">Total Pembayaran</div>
    <div class="amount-value">{{AMOUNT}}</div>
    <div class="qr-wrapper tactile-inset"><img src="{{QR_IMAGE_URL}}" alt="QRIS Code"></div>
    <div class="timer-box tactile-inset"><span>Batas Waktu Pembayaran</span><span class="timer-val" id="timer-text">05:00</span></div>
    <div class="status-badge status-pending" id="status-badge"><i class="fa-solid fa-clock" id="status-icon"></i><span id="status-text">Menunggu Pembayaran</span></div>
    <button class="btn-check tactile-btn" id="btn-check" onclick="checkStatusManual()"><span class="spinner" id="btn-spinner"></span><i class="fa-solid fa-arrows-rotate"></i><span id="btn-label">Cek Status Pembayaran</span></button>
    <div class="toggle-box"><input type="checkbox" id="chk-auto" onchange="handleAutoPollChange(this)"><label for="chk-auto">Cek otomatis setiap 8 detik (Opsional)</label></div>
    <div class="success-box" id="success-details"><strong><i class="fa-solid fa-circle-check"></i> Pembayaran Berhasil!</strong><p>Order ID: <span id="tx-order"></span></p><p>Sumber: <span id="tx-issuer"></span></p><p>Waktu: <span id="tx-time"></span></p></div>
    <a class="back-link" href="/"><i class="fa-solid fa-arrow-left"></i> Kembali ke dashboard</a>
  </div>
  <script>
    const qrisId="{{ID}}",expiresTimestamp={{EXPIRES_TIMESTAMP}};
    let isChecking=false,isPaid=false,isExpired=false,pollTimer=null;
    function toast(msg){
      const t=document.createElement('div');t.className='tactile-box';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;font-size:12px;font-weight:600;z-index:99';
      t.innerText=msg;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},2500);
    }
    function updateCountdown(){if(isPaid)return;const diff=expiresTimestamp-Date.now();if(diff<=0){isExpired=true;document.getElementById('timer-text').innerText='00:00';document.getElementById('status-badge').className='status-badge status-expired';document.getElementById('status-icon').className='fa-solid fa-circle-xmark';document.getElementById('status-text').innerText='QRIS Kedaluwarsa';document.getElementById('btn-check').disabled=true;document.getElementById('chk-auto').disabled=true;clearInterval(countdownInterval);stopAutoPoll();return}document.getElementById('timer-text').innerText=String(Math.floor(diff/60000)).padStart(2,'0')+':'+String(Math.floor(diff%60000/1000)).padStart(2,'0')}
    const countdownInterval=setInterval(updateCountdown,1000);updateCountdown();
    async function checkStatusManual(){if(isChecking||isPaid||isExpired)return;isChecking=true;const btn=document.getElementById('btn-check'),spinner=document.getElementById('btn-spinner'),label=document.getElementById('btn-label');btn.disabled=true;spinner.style.display='inline-block';label.innerText='Memeriksa...';try{const res=await fetch('/api/qr-status/'+qrisId),data=await res.json();if(data.success&&data.paid){onPaymentSuccess(data.transaction)}else if(data.status==='EXPIRED'){isExpired=true;updateCountdown()}else{document.getElementById('status-text').innerText='Belum Dibayar (Coba lagi...)';setTimeout(()=>{if(!isPaid&&!isExpired)document.getElementById('status-text').innerText='Menunggu Pembayaran'},2000)}}catch(err){console.error('Gagal periksa status:',err)}finally{isChecking=false;if(!isPaid&&!isExpired)btn.disabled=false;spinner.style.display='none';label.innerText='Cek Status Pembayaran'}}
    function onPaymentSuccess(tx){isPaid=true;stopAutoPoll();clearInterval(countdownInterval);document.getElementById('status-badge').className='status-badge status-paid';document.getElementById('status-icon').className='fa-solid fa-circle-check';document.getElementById('status-text').innerText='Pembayaran Berhasil / Lunas';const btn=document.getElementById('btn-check');btn.disabled=true;btn.style.display='none';const qw=document.querySelector('.qr-wrapper'),tb=document.querySelector('.timer-box');if(qw)qw.style.display='none';if(tb)tb.style.display='none';if(tx){document.getElementById('tx-order').innerText=tx.order_id||tx.transaction_id||'-';document.getElementById('tx-issuer').innerText=tx.payer_issuer||'GoPay / Bank';document.getElementById('tx-time').innerText=tx.transaction_time?new Date(tx.transaction_time).toLocaleString('id-ID'):'-';document.getElementById('success-details').style.display='block'}}
    function startAutoPoll(){stopAutoPoll();pollTimer=setInterval(()=>{if(!isChecking&&!isPaid&&!isExpired)checkStatusManual()},8000)}
    function stopAutoPoll(){if(pollTimer){clearInterval(pollTimer);pollTimer=null}}
    function handleAutoPollChange(chk){chk.checked?startAutoPoll():stopAutoPoll()}
    (function initWS(){try{var proto=location.protocol==='https:'?'wss':'ws',ws=new WebSocket(proto+'://'+location.host+'/ws?scope=qr:'+qrisId);ws.onmessage=function(e){try{var m=JSON.parse(e.data);if(m.type==='qris_paid')onPaymentSuccess(m.data||{})}catch(_){}};ws.onclose=function(){setTimeout(initWS,3000)}}catch(_){}})();
    try{{{PAYLOAD_SCRIPT}}}catch(e){console.error(e)}
  </script>
</body>
</html>
