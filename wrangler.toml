name = "simpulpay"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "APP_HUB", class_name = "AppHub" },
  { name = "SUB_TIMER", class_name = "SubTimer" },
]

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "f9f225649fba4bac9a7ce860d66fa605"

[exports.AppHub]
type = "durable-object"
storage = "sqlite"

[exports.SubTimer]
type = "durable-object"
storage = "sqlite"

[triggers]
crons = ["* * * * *"]
