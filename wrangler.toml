name = "simpulpay-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "APP_HUB", class_name = "AppHub" },
  { name = "SUB_TIMER", class_name = "SubTimer" },
]

[exports.AppHub]
type = "durable-object"
storage = "sqlite"

[exports.SubTimer]
type = "durable-object"
storage = "sqlite"

[triggers]
crons = ["* * * * *"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
